[project]
name = "body-harness"
version = "0.1.0"
description = "A small agent harness for minds and players in embody worlds: any OpenAI-compatible model, one seat per invite."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
bh = "body_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/body_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
